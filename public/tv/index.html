<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Ana Ekran</title>
<style>
  :root { --bg:#0b0b0c; --tile:#17171a; --text:#ececec; --dim:#7a7a80; --focus:#f2a33a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--text);
    font-family: "Samsung One", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow:hidden; cursor:none; }
  main { height:100%; display:flex; flex-direction:column; justify-content:center; padding:0 6vw; gap:6vh; }
  header { display:flex; align-items:baseline; gap:2vw; }
  #clock { font-size:9vw; font-weight:200; letter-spacing:-.02em; line-height:1; }
  #date { font-size:1.8vw; color:var(--dim); }
  #grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:2vw; }
  .tile { background:var(--tile); border:0.25vw solid transparent; border-radius:1.2vw; height:16vh;
    display:flex; align-items:center; justify-content:center; font-size:2.2vw; font-weight:500;
    color:var(--text); text-decoration:none; outline:none; transition:transform .15s, border-color .15s; }
  .tile:focus { border-color:var(--focus); transform:scale(1.06); }
  footer { color:var(--dim); font-size:1.1vw; }
</style>
</head>
<body>
<main>
  <header><div id="clock">--:--</div><div id="date"></div></header>
  <nav id="grid"></nav>
  <footer>Ok tuşlarıyla gezin · OK ile aç · Geri ile bu ekrana dön</footer>
</main>
<script>
  // Kendi uygulamalarınızı buradan ekleyin / çıkarın.
  var APPS = [
    ["YouTube",     "https://www.youtube.com/tv"],
    ["Netflix",     "https://www.netflix.com"],
    ["Disney+",     "https://www.disneyplus.com"],
    ["Prime Video", "https://www.primevideo.com"],
    ["TRT İzle",    "https://www.tabii.com"],
    ["Spotify",     "https://open.spotify.com"],
    ["Hava Durumu", "https://wttr.in/?format=v2"],
    ["Haberler",    "https://lite.cnn.com"]
  ];
  var COLS = 4, grid = document.getElementById("grid");
  APPS.forEach(function (a) {
    var el = document.createElement("a");
    el.className = "tile"; el.textContent = a[0]; el.href = a[1]; el.tabIndex = 0;
    grid.appendChild(el);
  });
  var tiles = grid.children, i = 0;
  try { i = Math.min(+localStorage.getItem("tvFocus") || 0, tiles.length - 1); } catch (e) {}
  tiles[i].focus();
  document.addEventListener("keydown", function (e) {
    var k = e.keyCode, n = i;
    if (k === 37) n = i - 1; else if (k === 39) n = i + 1;
    else if (k === 38) n = i - COLS; else if (k === 40) n = i + COLS;
    else if (k === 13) { try { localStorage.setItem("tvFocus", i); } catch (e2) {} return; }
    else return;
    e.preventDefault();
    if (n >= 0 && n < tiles.length) { i = n; tiles[i].focus(); }
  });
  function tick() {
    var d = new Date();
    document.getElementById("clock").textContent =
      ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
    document.getElementById("date").textContent =
      d.toLocaleDateString("tr-TR", { weekday:"long", day:"numeric", month:"long" });
  }
  tick(); setInterval(tick, 10000);
</script>
</body>
</html>
